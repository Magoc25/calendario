name: Supabase Keep-Alive

# Guia §16/r86a: são DOIS projetos Supabase e por muito tempo este workflow
# protegia só o compartilhado — o que NÃO guarda dado nenhum. O pessoal
# (Camada 3, tabela cal_sync) ficava por conta do pg_cron, que foi medido e
# NÃO evita a suspensão (r88): estava sem defesa nenhuma, não com uma fraca.
# Sintoma quando pausa: "o app parou de sincronizar depois da última sessão",
# sem uma linha do app ter mudado.

on:
  schedule:
    - cron: '0 8 * * *'   # 05:00 horário de Brasília
    - cron: '0 20 * * *'  # 17:00 horário de Brasília
  workflow_dispatch: # permite rodar manualmente se necessário

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase compartilhado (reviews/pings/versão)
        env:
          SB_URL: ${{ secrets.REV_SB_URL }}
          SB_KEY: ${{ secrets.REV_SB_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/app_reviews?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Compartilhado respondeu $STATUS (esperado 200)."
            exit 1
          fi
          echo "Supabase compartilhado ativo."

      # always(): se o passo acima falhar, este AINDA roda — projeto fora do ar não
      # pode impedir o ping do outro, e é este que guarda os dados do calendário.
      - name: Ping Supabase pessoal (dados do app — Camada 3)
        if: always()
        env:
          SB_URL: ${{ secrets.OWN_SB_URL }}
          SB_KEY: ${{ secrets.OWN_SB_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::Secrets OWN_SB_URL / OWN_SB_KEY ausentes — o Supabase PESSOAL segue sem keep-alive e pausa em ~7 dias sem uso."
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/cal_sync?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Pessoal respondeu $STATUS — projeto pausado, chave trocada ou RLS alterada."
            exit 1
          fi
          echo "Supabase pessoal ativo."
